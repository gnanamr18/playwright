# CI = Continuous Integration
# Runs automatically on GitHub when you open/update a Pull Request (or push to main).
# This first version runs Jest unit tests only (fast, no browser/DB needed).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Jest unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Run Jest
        run: npm run test:unit
